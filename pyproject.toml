# Package ######################################################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msmodeling"
description = "Light-weight full-system simulation framework"
readme = "README.md"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "numpy",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "pydantic",
    "pydantic-settings",
    "pyswarms",
    "requests",
]

[project.scripts]
msmodeling = "cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["tensor_cast", "serving_cast", "cli", "optix", "web_ui"]

[tool.hatch.build.targets.wheel.force-include]
"optix/config.toml" = "optix/config.toml"

# Test tools ###################################################################

[tool.pytest.ini_options]
pythonpath = ["."]
# Default norecursedirs includes "build", which skips tests/regression/scripts/helpers/build/.
norecursedirs = ["__pycache__"]
markers = [
    "nightly: do_compile=True large model cases, only run in nightly",
    "npu: requires NPU hardware",
    "network: requires live model Hub access (HuggingFace/ModelScope); excluded by default, run in nightly",
]
addopts = "-m 'not npu and not nightly and not network'"
testpaths = ["tests"]

# Coverage #####################################################################

[tool.coverage.run]
parallel = true
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
    "*/builtin_model/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "raise NotImplementedError",
]

[dependency-groups]
lint = [
    "pre-commit>=4.3.0",
]
ci = [
    "parameterized>=0.9.0",
    "pathspec>=0.12",
    "pydantic>=2",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6",
    "tomli>=2.0; python_version < '3.11'",
    "types-colorama>=0.4.15",
]
build = [
    "tomli>=2.0 ; python_full_version < '3.11'",
]
