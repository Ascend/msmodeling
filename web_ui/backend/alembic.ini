# Alembic config for the msmodeling web backend.
# The sqlalchemy.url is set programmatically in migrations/env.py (env-driven path).
# NOTE: script_location is "migrations" (NOT "alembic") so the directory does NOT
# shadow the pip-installed `alembic` package on sys.path -- see db._run_alembic.

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
