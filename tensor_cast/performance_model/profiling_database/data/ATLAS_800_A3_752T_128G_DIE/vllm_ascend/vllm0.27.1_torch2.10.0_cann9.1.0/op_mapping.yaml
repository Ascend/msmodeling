      RecurrentKda). triton-ascend kernel ChunkKdaFwd (MIX_AIC; vllm-ascend
      chunk_kda path). TC passes (query, key, value, beta, g, chunk_size,
      state_read_passes, state_write_passes); ChunkKdaFwd.csv takes 10
      inputs in the order (q, k, v, g(B,T,H,D), beta(B,H,T), A_log(H),
      dt_bias(H*D_v), initial_state(B,H,K,V), cu_seqlens(B+1),
      chunk_indices(ceil(T/32))) — tc_input_count=3 matches on (q,k,v)
      only, mirroring RecurrentKda. Seed rows (tp=16, H=6): 4x(1,8064,6,128)
      + ..., MIX_AIC, 2688-3934us. NOTE: TC demand (B,T,H,D) folds batch
      into the CSV dim0=1 varlen layout; multi-batch prefill (B>1) is a
      documented shape_mismatch known limitation (see header Known
      limitations) — no shape_normalize override is configured.

