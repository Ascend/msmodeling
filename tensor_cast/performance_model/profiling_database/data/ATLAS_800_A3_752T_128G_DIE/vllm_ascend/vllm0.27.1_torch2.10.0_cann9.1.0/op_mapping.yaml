    tc_input_count: 2
    notes: Quantized batched matmul maps directly to QuantBatchMatmulV3 and preserves its batch axis.

  "tensor_cast.mlapo.default":
    composite: true
    decomposer: true
    decomposer_options:
      kv_cache_query:
        mode: pool_dim0_agnostic
        block_size: 128
        dtype: DT_BF16
    notes: >
      [HIGH] MLAPO composite. Python decomposer (_decompose_mlapo_common) handles
      shape derivation. NPU kernel sequence:
      2x MatMulV2 (fused_qkv_a_proj, q_b_proj) + KvRmsNormRopeCache (post-projection
      norm+rope+cache). Shapes derived from OpInvokeInfo.args projection weights.

  "tensor_cast.mlapo_quant.default":
    composite: true
    decomposer: true
    require_all_sub_kernels: true
    decomposer_options:
      visible_kernel_regime:
        requires_sequence_parallel: true
        # Opaque means that TC cannot see the internal kernel sequence. The
        # latency is still modeled by the versioned opaque_kernel query below.
        otherwise: opaque_kernel_query
      projection_token_partition: tp
      reconstruct_q_heads_by_tp: false
      kv_cache_query:
        mode: pool_dim0_agnostic
        block_size: 128
        dtype: DT_BF16
      opaque_kernel:
        kernel_type: mla_preprocess_0_mix_aic
        query_mode: mlapo_preprocess
        block_size: 128
        cache_mode: krope_ctkv
        quant_mode: per_tensor_quant_asymm
        enable_inner_out: true
        weight_quantized: true
        weight_format: FRACTAL_NZ
    notes: >
      [HIGH] Quantized MLAPO composite. Python decomposer (_decompose_mlapo_common) handles
      shape derivation. Quantized projections explicitly include AscendQuantV2 +
      QuantBatchMatmulV3 around shared RmsNorm/KvRmsNormRopeCache semantics. The
      visible ordinary sub-kernels are a sequence-parallel prefill regime; the
      non-SP W8A8 decode regime queries mla_preprocess_0_mix_aic by its runtime
      semantics. DSA CP already supplies the global q-head count, so the
      datasource must not multiply it by TP a second time. Partial ordinary-
      kernel matches remain prohibited.

  "tensor_cast.dsa_indexer.default":
    composite: true
    decomposer: true
    primary_kernel_type: LightningIndexer
    alternate_kernel_types: [LightningIndexerVllm]
    notes: >
      [HIGH] GLM5 BF16 DSA indexer. Python decomposition derives ordinary
      projection and normalization kernels from OpInvokeInfo tensors and
      weights. LightningIndexer requires query-token, effective-sequence,
      phase and top-k context; cache pool capacity is not a semantic key.


