  # ========== 22. Kimi K3 linear attention / hybrid MLA (A3 seed) ==========
  #
  # K3-specific kernels parsed from the A3 K3 decode capture (9 CSVs in this
  # directory). Ops deliberately left unmapped are documented here so the next
  # collection round knows what is missing:
  # - tensor_cast.situ: NPU runs the fused SiTU+quant kernel DequantSituQuant
  #   ((T,2I) BF16 -> (T,I) INT8 + scale). TC models SiTU (two inputs gate/up)
  #   and the activation quant (tensor_cast.dynamic_quantize_symmetric ->
  #   DynamicQuant.csv) as separate ops, so mapping situ to the fused kernel
  #   would double-count the quant and mismatch the input layout. Requires a
  #   TC-side situ+quant fusion pass (see kimi_k3.py SiTU notes) first.
  # - tensor_cast.linear_attn_gated_rmsnorm / tensor_cast.apply_attn_res:
  #   Triton kernels dropped by the parser (N/A shapes) — see header notes.
  # - tensor_cast.linear_attn_fused_gdn_gating: Qwen3.5-style scalar-gating op,
  #   not used by K3 (K3 uses vector g via f_a_proj/f_b_proj GEMMs).

  "tensor_cast.linear_attn_recurrent_gated_delta_rule.default":
    kernel_type: RecurrentKda
    tc_input_count: 3
    skip_base_exact: true
    notes: >
      [HIGH] K3 decode KDA core. aclnn: aclnnRecurrentKda. TC passes
      (query, key, value, beta, g, state_read_passes, state_write_passes);
      RecurrentKda.csv takes 11 inputs in the order (q, k, v, g(B,T,H,D),
      beta(B,T,H), state, ...params) — TC beta/g sit at swapped positions
      relative to the CSV, so tc_input_count=3 matches on (q,k,v) only;
      beta/g head dims are covered implicitly by q/k. Seed row:
      4x(1,16,6,128) + (1,16,6), AI_VECTOR_CORE, 45-47us.

  "tensor_cast.linear_attn_chunk_gated_delta_rule.default":
    kernel_type: ChunkKdaFwd
    tc_input_count: 3
    notes: >
