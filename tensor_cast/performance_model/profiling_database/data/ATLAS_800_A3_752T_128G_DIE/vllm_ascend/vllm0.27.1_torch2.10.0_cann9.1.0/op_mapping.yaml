
# op_mapping.yaml — operator mapping table (target stack: CANN 9.1.0 + vLLM-ascend 0.27.1 + PyTorch 2.10.0)
# Path: tensor_cast/performance_model/profiling_database/data/{device}/vllm_ascend/{version}/op_mapping.yaml
# ============================================================================
# Kimi K3 seed database (parse/A3)
# ============================================================================
# This file is derived from the base vllm0.23.0rc1_torch2.10.0_cann9.0.1
# mapping, extended with Kimi-K3 entries backed by the A3 K3 decode
# profiling seed (9 operator CSVs in this directory, re-parsed on 2026-09-03
# from the complete 4-layer A3 K3 decode kernel_details dump, 231 kernels;
# supersedes the 2026-08-31 partial-layer parse).
#
# Evidence stack vs target stack: the directory and the metadata below target
# vllm0.27.1 + torch 2.10.0 + CANN 9.1.0, but the K3 seed CSVs were collected
# on the older vllm_ascend 0.23.0rc1 / CANN 9.2.0 stack and are reused here
# as-is. "CANN 9.2.0" / "vllm_ascend 0.23.0rc1" mentions in entry notes cite
# that legacy collection evidence; recollection on the target stack is
# pending.
#
# Known limitations of this seed database:
# - Only 9 kernel CSVs exist here. Base entries whose kernel_type CSV is
#   absent in this directory resolve to csv_not_found and fall back to the
#   analytic model. That is expected for a seed database.
# - BatchMatMulV2.csv is absent (csv_not_found data gap): the KDA per-head
#   BMM (6,16,128)x(6,128,512) BF16 (~7.6us) observed in the capture has no
#   local CSV, so the primary kernel of aten.bmm misses here; only the
#   TransposeBatchMatMul alternate has local rows.
# - ChunkKdaFwd multi-batch prefill (B>1) is an expected shape_mismatch
#   known limitation: the seed CSV only covers the single-batch varlen
#   layout (1,B*T,H,D); no shape_normalize override is configured for B>1.
# - Triton kernels (layer_norm_gated_fwd_kernel, _apply_attn_res_kernel) are
#   recorded with N/A shapes by msprof and were dropped by the parser, so
#   tensor_cast.linear_attn_gated_rmsnorm / tensor_cast.apply_attn_res stay
#   unmapped (analytic fallback) until shape-enabled collection exists.
# - tensor_cast.mla_prolog corresponds to the NPU sequence
#   RmsNorm + Slice + ScatterPaKvCache + Transpose (+ PadV3 padding); it
#   needs a Python decomposer before a composite mapping can be written.
# - Each shape carries 1-4 samples (four layers aggregated); run
#   generate_shape_grid.py + start_microbench.py before using this database
#   for production queries.

version: "0.27.1"
device: ATLAS_800_A3_752T_128G_DIE
cann_version: "9.1.0"
pytorch_version: "2.10.0"
op_plugin_version: "7.3.0"
collection_date: "2026-09-07"

#communication_data_ref: "../../hccl/v9.1.0/"
communication_fallback: analytic

latency_policy:
  kernel_overrides:
    QuantBatchMatmulV3:
      # MIX_AIC runs AIC and AIV concurrently, so max(aicore_time, aiv_time)
      # is the device-core execution envelope. In this A3/CANN 9.2.0 snapshot,
      # consistent duration/core ratios end at 1.309; suspicious rows start at
      # 1.788 and extend to 19.481. The versioned 1.5 boundary lies in that
      # observed gap and must be recalibrated for another device or CANN build.
      profiling_core_envelope_fallback:
        max_duration_to_core_ratio: 1.5
    LightningIndexer:
      prefer_profiling_rows: true
    ScatterNdUpdate:
      prefer_profiling_rows: true
    DispatchFFNCombine:
      # Service-profiled DFC rows include its critical-path synchronization.
      # Prefer them over duplicate exact-shape microbench rows.
      prefer_profiling_rows: true
    mla_preprocess_0_mix_aic:
      # Decode service profiling captures launch/synchronization work that the
      # isolated microbench duration does not include.
      prefer_profiling_rows: true

query_selection_policy:
  kernel_overrides:
    FusedInferAttentionScore:
      require_semantic_unique: true
    # K3 MLA sink variant of FIA (same attention-mode query path).
    FusedInferAttentionScoreV2Sink:
      require_semantic_unique: true
    SparseFlashAttention:
      require_semantic_unique: true
    LightningIndexer:
      require_semantic_unique: true
    KvRmsNormRopeCache:
      require_semantic_unique: true

interpolation_policy:
  kernel_overrides:
    MatMulV2:
      max_interpolation_dim: 1
    MatMulV3:
      max_interpolation_dim: 1
    MatMulCommon:
      max_interpolation_dim: 1
    ConcatD:
      generic_compute:
        axis: output_numel
    AddRmsNormBias:
      generic_compute:
        # x and residual share the leading token axis.  Keep that axis
        # continuous while weight/bias shapes remain strict regime fields.
        co_varying_input_indices: [1]
    QuantBatchMatmulV3:
      # A value of 1 allows one-dimensional interpolation; it does not disable
      # interpolation. Generic compute varies activation axis 0 (M/token count)
      # while the activation tail, queried weight shape, and input dtypes remain
      # exact in the regime key. static_quant_linear uses tc_input_count=2, so
      # its scale/offset slots are intentionally not interpolation axes.
      max_interpolation_dim: 1
    FusedInferAttentionScore:
      axis_transform: sqrt_seq
    # K3 MLA sink variant of FIA: same O(seq^2) attention complexity.
    FusedInferAttentionScoreV2Sink:
      axis_transform: sqrt_seq
    CausalConv1d:
      generic_compute:
        # TC passes mixed_qkv as (b, dim, t); profiling CSV stores the
        # flattened (b*t, dim) activation. conv_1d_bt normalizes the TC
        # layout to the CSV layout before axis/regime extraction.
        shape_normalize: conv_1d_bt
    RecurrentKda:
      generic_compute:
        # TC decode passes batched (B, T, H, D) q/k/v while RecurrentKda.csv
        # rows use the varlen layout (1, B*T, H, D) with cu_seqlens
        # boundaries (slot contract in RecurrentKda_run.py). varlen_bt
        # folds batch into the token axis before axis/regime extraction;
        # k/v co-vary with the packed token axis so the regime key stays
        # token-count-independent and interpolation can cross CSV T rows.
        shape_normalize: varlen_bt
        co_varying_input_indices: [1, 2]
    SparseFlashAttention:
      # Legacy generic SFA is matched in compute mode on the q-shape (num_tokens, num_heads,
      # fia_head_dim); this shape carries no seq/topk dimension, so the transform
      # interpolates over num_tokens, not avg_seq_len. The single-q-shape key
      # cannot yet distinguish context/topk length — revisit whether to encode
      # avg_seq_len/topk in the key before importing real SFA profiling data
      # (see issue #213). linear = no sqrt transform (compute-mode default).
      axis_transform: linear
      # The Phase2 canonical leaf path uses q_tokens/effective_kv_len directly.
    GatherV2:
      generic_compute:
        axis: output_numel
    Index:
      generic_compute:
        axis: output_numel

# ============================================================================
# Calculate operator mapping (operator_mappings)
# ============================================================================

operator_mappings:

  # ========== 1. Standard aten operator ==========

  "aten.mm.default":
    kernel_type: MatMulV2
    alternate_kernel_types: [MatMulV3, MatMulCommon]
    notes: >
      [HIGH] op-plugin: MmKernelNpuOpApi.cpp → aclnnMm (ND) / aclnnMatmulWeightNz (NZ).
      CANN 9.2.0 kernel dispatch: MatMulV2 (small M, Decode), MatMulV3 (large M, Prefill FFN).
      0325 profiling (re-collected): Qwen3 PF MatMulV2(516x)+MatMulV3(512x); DC MatMulV2(43263x).
      DSv3 PF MatMulV2(1951x), MatMulCommon(29x); DC MatMulV2(3771x).

  "aten.addmm.default":
    kernel_type: MatMulV2
    notes: >
      [MEDIUM] op-plugin: AddmmKernelNpuOpApi.cpp.
      aclnn: aclnnAddmm (ND), aclnnAddmmWeightNz (NZ); The underlying kernel Type is still MatMulV2.
      In vLLM inference, nn.Linear usually takes mm (no bias), and addmm rarely appears.

  "aten.bmm.default":
    kernel_type: BatchMatMulV2
    alternate_kernel_types: [TransposeBatchMatMul, BatchMatMulNd]
    degenerate_bmm_kernel_type: Mul
    notes: >
      [HIGH] op-plugin: BmmKernelNpuOpApi.cpp → aclnnBatchMatMul → BatchMatMulV2.
      Dispatch: transpose_b parameter → TransposeBatchMatMul (MLA attn_output @ W_UV).
      Standard BMM → BatchMatMulV2. 0313 profiling: BatchMatMulV2(305x), TransposeBatchMatMul(305x).
      GLM5 sampling uses (1,32,1)@(1,1,T); CANN lowers this degenerate K=1
      BMM to a broadcast Mul kernel, matched only on the exact two input shapes.

  "aten.embedding.default":
    kernel_type: GatherV2
    alternate_kernel_types: [GatherV3, GatherV2AiCore]
    tc_input_count: 2
    notes: >
      [HIGH] op-plugin: EmbeddingKernelNpuOpApi.cpp → aclnnEmbedding → GatherV2.
      v0.18.0: CANN dispatch to GatherV2AiCore in Decode mode. 0325 profiling: Qwen3 DC GatherV2AiCore(191x).
      TC has (weight, indices, ...); NPU CSV has (weight, indices, axis) — tc_input_count=2.

  "tensor_cast.mrope_cache_lookup.default":
    kernel_type: GatherV2
    alternate_kernel_types: [GatherV3, GatherV2AiCore]
    tc_input_count: 2
    notes: >
      Bailing M-RoPE serving path selects the precomputed cos/sin table by
      token positions; TensorCast folds the T/H/W layout into this lookup.
      Restored from the vllm0.23.0rc1 baseline; not applicable to Kimi K3
      (K3 has no M-RoPE cache lookup on this path) and kept for mapping
      parity with the baseline.

  "aten.index_select.default":
    kernel_type: GatherV3
    alternate_kernel_types: [GatherV2]
    notes: >
      [MEDIUM] op-plugin: IndexSelectKernelNpuOpApi.cpp.
      aclnn: aclnnIndexSelect → GatherV3.

  "aten.convolution.default":
    kernel_type: Conv2D
    notes: >
      [LOW] op-plugin: ConvolutionKernelNpuOpApi.cpp.
      aclnn: aclnnConvolution. LLM does not contain convolutional layers; only used for video/image models.

  "aten.cat.default":
    kernel_type: ConcatD
    notes: >
      [MEDIUM] v0.18.0 ships local ConcatD.csv, so cat should query measured
      ConcatD rows instead of unconditional zero_cost. MoE shared expert path
      concat is still negligible in common traces, but database coverage wins
      when a measured kernel exists.

  "tensor_cast.cat.default":
    kernel_type: ConcatD
    notes: >
      [MEDIUM] Same as aten.cat.default; use ConcatD.csv when present.

  "aten.add.Tensor":
    kernel_type: Add
    alternate_kernel_types: [AddAiCore]
    query_mode: elementwise
    notes: >
      [HIGH] op-plugin: AddKernelNpuOpApi.cpp.
      aclnn: aclnnAdd. Profiling: Qwen3 CANN 9.2.0 Add(30x).
      query_mode=elementwise: total tensor I/O interpolation with exact dtype matching.
      Keeps broadcast patterns isolated without borrowing latency across dtypes.

  "aten.to.dtype":
    kernel_type: Cast
    alternate_kernel_types: [TensorMove, CastAiCore, TensorMoveAiCore]
    notes: >
      [HIGH] op-plugin: CastKernelNpuOpApi.cpp → aclnnCast.
      Dispatch (CANN internal): src_dtype != dst_dtype → Cast; src_dtype == dst_dtype → TensorMove.
      CastAiCore: AiCore-accelerated Cast variant (CANN 9.2.0+). 0313 profiling: Cast(1613x), CastAiCore(670x).


  # ========== 2. Quantized Linear ==========

  "tensor_cast.static_quant_linear.default":
    kernel_type: QuantBatchMatmulV3
    tc_input_count: 2
    compute_subcategory: quantized_matmul
    expected_input_formats: [ND, FRACTAL_NZ]
    query_mode: mtp_projection
    mtp_projection_kernel_type: MatMulV2
    tp_linear_projection:
      shard_axis: input
      logical_global_dims: [16384]
      otherwise: physical_local
    notes: >
      [HIGH] op-plugin: WeightQuantBatchMatmulV2KernelNpuOpApi.cpp.
      aclnn: aclnnWeightQuantBatchMatmulV2/V3. W8A8 path.
      TC has (x, weight, scale, ...); NPU CSV has (x, weight_NZ, scale, scale) — tc_input_count=2 for (x, weight).
      A structural 2H-to-H concat projection follows the service BF16 path;
      datasource resolves its MatMulV2 row.
      In this versioned GLM5 layout, K=16384 is the replicated logical-global
      DSA CP o_proj input and is always projected by TP. Other K dimensions are
      already physical-local and are never sharded a second time.

  "tensor_cast.static_quant_linear_int4.default":
    kernel_type: QuantBatchMatmulV3
    tc_input_count: 2
    compute_subcategory: quantized_matmul
    expected_input_formats: [ND, FRACTAL_NZ]
    expected_input_dtypes:
    - INT8
    - INT8
    restore_packed_int4: true
    notes: >
      [MEDIUM] op-plugin: npu_weight_quant_batchmatmul / npu_quant_matmul.
      W4A8; INT4 weights packed as INT32. The packed input has no torch-side
      dtype of its own (pack_int4 yields uint8), so the profile dtypes are
      pinned via expected_input_dtypes to match the CSV regime prefix.
      restore_packed_int4: the INT32-packed weight slot restores its logical
      K ([K/8, N] -> [K, N]) on the interpolation path before axis extraction.

  "tensor_cast.fp8_linear.default":
    kernel_type: QuantBatchMatmulV3
    tc_input_count: 2
    compute_subcategory: quantized_matmul
    expected_input_formats: [ND, FRACTAL_NZ]
    notes: >
      [LOW] FP8 matmul; mapping to QuantBatchMatmulV3 is a design assumption, to be verified by FP8 profiling.

  "tensor_cast.mxfp4_linear.default":
    kernel_type: QuantBatchMatmulV3
    tc_input_count: 2
    compute_subcategory: quantized_matmul
    expected_input_formats: [ND, FRACTAL_NZ]
    notes: >
      [LOW] MXFP4 matmul; placeholder, to be verified after hardware support.


  # ========== 3. GroupedMatmul (MoE) ==========

  "tensor_cast.grouped_matmul.default":
    kernel_type: GroupedMatmul
    notes: >
      [HIGH] op-plugin: GroupedMatmulKernelNpuOpApi.cpp.
      aclnn: aclnnGroupedMatmul/V4/V5/WeightNz. BF16 base.
      v0.18.0: DSv3 routing expert FFN absorbed by DispatchFFNCombine (aclnnDispatchFFNCombineBF16).
      In --compile mode, grouped_matmul is replaced by DispatchFFNCombine fusion pass.

  "tensor_cast.grouped_matmul_quant.default":
    kernel_type: GroupedMatmul
    query_mode: grouped_moe
    fixed_capacity_first_dim: 6656
    notes: >
      [HIGH] op-plugin: npu_grouped_matmul with scale/per_token_scale. W8A8.
      CANN 9.2.0 aclgraph: Routing expert down proj absorbed by DispatchFFNCombine super fusion.
      In --compile mode, grouped_matmul_quant is replaced by DispatchFFNCombine fusion pass.

  "tensor_cast.grouped_matmul_quant_int4.default":
    kernel_type: GroupedMatmul
    tc_input_count: 2
    ignore_batch_dims: true
    slot_tensor_inputs: true
    restore_packed_int4: true
    prefer_same_group: true
    expected_input_dtypes:
    - INT8
    - DT_INT4
    notes: >
      [HIGH] op-plugin: npu_grouped_matmul with antiquant_scale/offset. W4A8.
      tc_input_count=2 keeps the activation + quantized weight for regime
      matching; the INT4 weight has no torch-side dtype, so the profile
      dtypes are pinned via expected_input_dtypes (exact + interpolation).
      ignore_batch_dims: sink-split groups per-expert W4A8 weights as packed
      [K/2, N] tensors and the per-call group count (hit experts) differs from
      the CSV anchor expert count (EP-local expert capacity); the group count
      is routing semantics, not a shape axis, so the regime omits batch_dims
      and matching tolerates the CSV-side field.
      slot_tensor_inputs: per-expert x/w argument lists are extracted one
      entry per argument slot (first list slot concatenates dim 0, later list
      slots carry a leading group dim) instead of element-wise flattening, so
      the weight slot is not displaced by the tc_input_count=2 slice.
      restore_packed_int4: the packed INT4 weight slot restores its logical K
      ([K/2, N] / [K/8, N] -> [K, N]) before matmul axis extraction.
      prefer_same_group: when the regime key omits batch_dims, candidate
      groups whose CSV batch_dims equal the queried weight footprint rank
      first.

  "tensor_cast.grouped_matmul_fp8.default":
    kernel_type: GroupedMatmul
    notes: >
      [HIGH] op-plugin: npu_grouped_matmul with scale, no offset. FP8.

  "tensor_cast.grouped_matmul_mxfp4.default":
    kernel_type: GroupedMatmul
    notes: >
      [MEDIUM] op-plugin: npu_grouped_matmul. MXFP4.


  # ========== 4. GroupedMatmul+SwiGlu fusion ==========

  "tensor_cast.grouped_matmul_swiglu.default":
    kernel_type: GroupedMatmul
    notes: >
      [MEDIUM] op-plugin: npu_grouped_matmul with act_type parameter. BF16 GMM+SwiGlu.

  "tensor_cast.grouped_matmul_quant_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    query_mode: grouped_moe
    fixed_capacity_first_dim: 6656
    notes: >
      [HIGH] op-plugin: GroupedMatmulSwigluQuantNpuOpapi.cpp.
      aclnn: aclnnGroupedMatmulSwigluQuantWeightNZ. W8A8 GMM+SwiGlu+Quant.
      CANN 9.2.0 aclgraph: Routing specialist FFN absorbed by DispatchFFNCombine super fusion.
      In --compile mode, grouped_matmul_quant_swiglu is replaced by DispatchFFNCombine fusion pass.

  "tensor_cast.grouped_matmul_quant_int4_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    notes: >
      [LOW] W4A8 GMM+SwiGlu+Quant; V2 API may be available in op-plugin 7.3.0.

  "tensor_cast.grouped_matmul_fp8_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    notes: >
      [LOW] FP8 GMM+SwiGlu+Quant; placeholder.

  "tensor_cast.grouped_matmul_mxfp4_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    notes: >
      [LOW] MXFP4 GMM+SwiGlu+Quant; placeholder.


  # ========== 5. MoE Routing (Token Routing) ==========

  "tensor_cast.dispatch_ffn_combine.default":
    kernel_type: DispatchFFNCombine
    query_mode: moe_fused
    project_full_shape: true
    notes: >
      [HIGH] path: C. vllm-ascend v0.15.0 Super Fusion MoE op (csrc/dispatch_ffn_combine/).
      torch binding: torch.ops._C_ascend.dispatch_ffn_combine.
      aclnn: aclnnDispatchFFNCombine (INT8/W8A8) / aclnnDispatchFFNCombineBF16 (BF16).
      CANN: OP_ADD(DispatchFFNCombine) in dispatch_ffn_combine_def.cpp. Profiling: DispatchFFNCombine(928x, 35.3%).
      TC fusion pass (DispatchFFNCombinePass): replaces init_routing_v2 + grouped_matmul(×N) + unpermute_tokens
      into single fused op with args (x, expert_indices).
      TC semantic args are projected to the real 7-input NPU shape before lookup;
      weights, expert indices, workspaces and probabilities must all align.
      The moe_fused interpolation index preserves the complete GMM1/GMM2 weight
      shapes and the same discrete operator regime after an exact miss.

  "tensor_cast.dispatch_ffn_combine_quant.default":
    kernel_type: DispatchFFNCombine
    query_mode: moe_fused
    project_full_shape: true
    embedded_compute:
      - kernel_type: AddRmsNormBias
        input_projection: residual_norm_from_activation
      - kernel_type: Cast
        input_projection: routing_weight_cast
        output_dtype: FLOAT
    notes: >
      W8A8 DFC variant. embedded_communication is optional so missing HCOM
      context or samples can fall back to the measured DFC latency. A successful
      HCOM lookup is still included in the total latency.
    embedded_communication:
      kernel_type: hcom_alltoall_
      optional: true
      message_bytes_mode: routed_input
      group_type: expert_parallel
      interpolation_method: alpha_beta

  "tensor_cast.dispatch_ffn_combine_quant_int4.default":
    kernel_type: DispatchFFNCombine
    query_mode: moe_fused
    project_full_shape: true
    notes: "W4A8 DFC variant."

  "tensor_cast.dispatch_ffn_combine_fp8.default":
    kernel_type: DispatchFFNCombine
    query_mode: moe_fused
    project_full_shape: true
    notes: "FP8 DFC variant."

  "tensor_cast.dispatch_ffn_combine_mxfp4.default":
    kernel_type: DispatchFFNCombine
    query_mode: moe_fused
    project_full_shape: true
    notes: "MXFP4 DFC variant."

  "tensor_cast.init_routing_v2.default":
    kernel_type: MoeDistributeDispatchV2
    alternate_kernel_types: [MoeTokenPermute]
    query_mode: moe_distribute
    moe_distribute_projection: dispatch
    notes: >
      [MEDIUM] op-plugin: MoeDistributeDispatchV2KernelOpApi.cpp.
      aclnn: aclnnMoeDistributeDispatchV2/V3/V4. EP path.
      CANN 9.2.0 aclgraph: Absorbed by DispatchFFNCombine Super Fusion.
      GLM5 MTP proposal layers remain unfused and profile as MoeDistributeDispatchV2.
      In v0.18.0 --compile mode, init_routing_v2 is replaced by DispatchFFNCombine fusion pass.

  "tensor_cast.unpermute_tokens.default":
    kernel_type: MoeDistributeCombineV2
    alternate_kernel_types: [MoeTokenUnpermute]
    query_mode: moe_distribute
    moe_distribute_projection: combine
    fixed_capacity_first_dim: 6656
    notes: >
      [MEDIUM] op-plugin: MoeDistributeCombineKernelV2OpApi.cpp.
      aclnn: aclnnMoeDistributeCombineV2/V3/V4. EP path.
      CANN 9.2.0 aclgraph: Absorbed by DispatchFFNCombine Super Fusion.
      GLM5 MTP proposal layers use the vLLM fixed-capacity 6656-token combine buffer.
      In v0.18.0 --compile mode, unpermute_tokens is replaced by DispatchFFNCombine fusion pass.

  "tensor_cast.moe_gating_top_k_softmax.default":
    kernel_type: MoeGatingTopK
    tc_input_count: 1
    notes: >
      [HIGH] op-plugin: MoeGatingTopKKernelNpuOpApi.cpp.
      aclnn: aclnnMoeGatingTopK.
      The second profiling input is the fixed expert-bias vector; TensorCast
      already passes processed logits, so only the first tensor participates
      in runtime shape matching.


  # ========== 6. Attention ==========

  "tensor_cast.attention.default":
    kernel_type: FusedInferAttentionScore
    alternate_kernel_types: [FusedInferAttentionScoreV2Sink]
    query_mode: attention_special
    notes: >
      [HIGH] op-plugin: FusedInferAttentionScoreKernelNpuOpApi.cpp.
      K3 A3 seed: MLA uses the sink variant aclnnFusedInferAttentionScoreV2Sink.
      FusedInferAttentionScoreV2Sink.csv is NOT part of this seed database
      (csv_not_found wherever V2Sink is the primary kernel), so sink-variant
      queries fall back to the plain FusedInferAttentionScore.csv rows here.
      aclnn: aclnnFusedInferAttentionScoreV2/V3.
      Profiling: Qwen3 CANN 9.2.0 FusedInferAttentionScore(1920x).

  "tensor_cast.attention_quant.default":
    kernel_type: FusedInferAttentionScore
    alternate_kernel_types: [FusedInferAttentionScoreV2Sink]
    query_mode: attention_special
    notes: >
      [HIGH] op-plugin: V1 with dequant/quant scales + V2 with quant_mode.
      K3 A3 seed: MLA uses the sink variant aclnnFusedInferAttentionScoreV2Sink.
      FusedInferAttentionScoreV2Sink.csv is NOT part of this seed database
      (csv_not_found wherever V2Sink is the primary kernel), so sink-variant
      queries fall back to the plain FusedInferAttentionScore.csv rows here.
      aclnn: aclnnFusedInferAttentionScoreV2/V3/V4.

  # ========== 7. MLA (Multihead Latent Attention) ==========

  "tensor_cast.multihead_latent_attention.default":
    composite: true
    decomposer: true
    decomposer_options:
      # Kimi-K3 dense prefill FIA profiles Q with its RoPE dimensions.
      prefill_fia_q_includes_rope: true
      # The observed single-request prefill uses separate current and cached KV.
      prefill_fia_split_context: true
    notes: >
      [HIGH] MLA composite. Python decomposer (_decompose_mla_common) handles
      shape derivation. NPU kernel sequence:
      Decode: BatchMatMulNd(q@W_UK_T) + FIA(attention) + TransposeBMM(out@W_UV).
      Prefill: MatMulV2(kv_c@kv_b_proj) + FIA.
      v0.18.0: Prefill uses FIA (unified, RING kernel removed).

  "tensor_cast.multihead_latent_attention_quant.default":
    composite: true
    decomposer: true
    decomposer_options:
      # K3 MLA on vllm0.23.0 replays decode attention as
      # aclnnFusedInferAttentionScoreV2Sink; fall back to the plain
      # FusedInferAttentionScore kernel when the sink CSV misses.
      attention_kernel_type: FusedInferAttentionScoreV2Sink
      alternate_kernel_types: [FusedInferAttentionScore]
    notes: >
      [HIGH] Quantized MLA composite. Python decomposer (_decompose_mla_common) handles
      shape derivation. NPU kernel sequence:
      Decode: QuantBatchMatmulV3(q@W_UK_T) + FIA + TransposeBMM(out@W_UV).
      Prefill: MatMulV2(kv_c@kv_b_proj) + FIA.
      v0.18.0: Prefill uses FIA (unified, RING kernel removed).

  "tensor_cast.mla_kv_projection.default":
    composite: true
    decomposer: true
    notes: >
      Explicit Prefill compressed-KV projection before core attention;
      kv_c@kv_b_proj maps to MatMulV2 as (M,K) x (N,K). GLM-5.2 SP prefill
      needs N=28672 with K=512; the v0.18 MatMulV2 table tops out at N=16384
      for that K, so the op must miss rather than interpolate past the grid.

  "tensor_cast.mla_kv_projection_quant.default":
    composite: true
    decomposer: true
    notes: >
      Explicit quantized Prefill compressed-KV projection before core attention;
      kv_c@kv_b_proj maps to MatMulV2.

  "tensor_cast.mla_merge_phase_outputs.default":
