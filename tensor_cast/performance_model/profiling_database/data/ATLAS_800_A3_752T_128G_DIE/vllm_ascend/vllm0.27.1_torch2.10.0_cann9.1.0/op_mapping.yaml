          /vllm-workspace/vllm-ascend). Triton op via triton-ascend; wrapper
          fused_recurrent_kda -> fused_recurrent_kda_fwd -> Triton kernel
          fused_recurrent_gated_delta_rule_fwd_kernel, which lowers to L0
          kernel RecurrentKda (profiling name
          aclnnRecurrentKda_RecurrentKda_RecurrentKda, AI_VECTOR_CORE).
          Call signature per tests/e2e/.../test_fused_recurrent_kda_npu.py:
          returns (o, final_state); decode has an in-place variant.
          HF reference: fla.ops.kda.fused_recurrent_kda
          (kimi_k3_origin_code/modeling_kimi_linear.py:629).
          Prefill counterpart chunk_kda exists (test_chunk_kda_npu.py) for the
          future linear_attn_chunk_gated_delta_rule mapping.
    aclnn: aclnnRecurrentKda
    microbench_api: "vllm_ascend.ops.triton.kda.kda.fused_recurrent_kda"

  ChunkKdaFwd:
    apis:
      - name: "vllm_ascend.ops.triton.kda.kda.chunk_kda"
        note: >
          VERIFY on A3 host (vllm_ascend 0.23.0rc1). Prefill counterpart of
          fused_recurrent_kda in the same module (see RecurrentKda entry);
          e2e coverage: tests/e2e/.../test_chunk_kda_npu.py. HF reference:
          fla.ops.kda.chunk_kda (kimi_k3_origin_code/modeling_kimi_linear.py).
