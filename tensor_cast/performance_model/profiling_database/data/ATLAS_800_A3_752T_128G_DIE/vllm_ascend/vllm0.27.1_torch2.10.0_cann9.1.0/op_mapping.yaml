  DequantSituQuant:
    apis:
      - name: "torch.ops._C_ascend.npu_dequant_swiglu_quant (SiTU mode; pending final confirmation)"
        note: >
          PARTIALLY CONFIRMED on A3 host. The SwiGLU counterpart is fully
          confirmed: vllm_ascend/ops/fused_moe/{moe_mlp.py:199,
          fused_moe.py:758, fused_moe_0_23_0.py:596} call
          torch.ops._C_ascend.npu_dequant_swiglu_quant, dispatching to tbe
          custom op "dequant_swiglu_quant" (attrs include swiglu_mode,
          glu_alpha, glu_bias). The tbe signature takes the (T,2I)->(T,I)
          layout matching our CSV rows. Investigation so far: (a) NO
          "situ"-named op/tbe file exists anywhere in vllm_ascend
          (_cann_ops_custom has dequant_swiglu_quant only); (b) MoE activation
          dispatch (moe_mlp.py:418-426) has no SITU branch — SWIGLUOAI /
          SWIGLUSTEP / GELU / GELU_TANH only; (c) MoEActivation enum is
          imported from UPSTREAM vllm
          (vllm.model_executor.layers.fused_moe.activation, editable install at
          /vllm-workspace/vllm). Remaining hypothesis: SiTU is a MoEActivation
          value defined in upstream vllm 0.23, routed through the default
          npu_dequant_swiglu_quant call with mode attrs, and the L0 layer
          selects the DequantSituQuant kernel variant by swiglu_mode.
          UPDATE (final round): upstream vllm fused_moe has NO situ either
          (grep zero hits), so SiTU is NOT a MoEActivation enum value. Full
          call-site args of the confirmed entry captured from moe_mlp.py:199:
          npu_dequant_swiglu_quant(x, weight_scale, activation_scale, bias,
          quant_scale, quant_offset, group_index, activate_left=True,
          quant_mode=1). Revised hypothesis: the tbe op dequant_swiglu_quant
          dispatches to DIFFERENT L0 kernels by activation attrs —
          DequantSwigluQuant vs DequantSituQuant; the SiTU variant is selected
          inside the tbe vendor file. UPDATE (round 2): torch_npu package and
          upstream vllm model files (incl. kimi_linear.py, which exists in
          vllm 0.23 for K3 linear attention) have ZERO situ hits; no
          situ-named file exists under _cann_ops_custom either. The tbe op
          dir contains dequant_swiglu_quant.cpp with multiple variant headers
          (dynamic/static x bf16/bias_int32/bias_float). UPDATE (round 3,
          hypothesis REVISED): grep -i situ inside the tbe source dir is ZERO
          and aclnn_dequant_swiglu_quant.h has no activation enum — so
          DequantSituQuant is NOT a variant of this tbe op. It must be a
          separate op registered in CANN builtin opp or torch_npu binaries
          (earlier torch_npu grep only covered .py/.h, not .so). CSV shape
          evidence confirms the semantic regardless of entry: two rows, both
          (T,2I)->(T,I) INT8 + (T,) FLOAT scale fusion — row1 (7168,6144)BF16
          ->(7168,3072)INT8+scale (MoE expert path, I=3072), row2
          (16,768)INT32+(768,)F+(16,)F ->(16,384)INT8+scale (decode, T=batch
          16, I=384). UPDATE (round 4): CANN builtin opp and libtorch_npu.so
          strings are both ZERO (only "situation" false positives). Gap found
          in earlier search: _cann_ops_custom was only searched by FILE NAME
          (find -iname), never by CONTENT — the CausalConv1d precedent shows
          the tbe registration file name can differ from the L0 kernel name
          (file causal_conv1d.py registers kernel "CausalConv1d"). So
          DequantSituQuant is likely a kernel name INSIDE a differently-named
          tbe file (e.g. a K3 activation op). Next: content grep the whole
          vendors dir: grep -rn -i situ _cann_ops_custom/vendors/ (exclude
          situation), and strings the compiled _C_ascend .so. UPDATE (round 5):
          content grep of _cann_ops_custom/vendors and strings of all 5 CPack
          .so files are ZERO — DequantSituQuant does not exist anywhere in
          the vllm-ascend repo or its build artifacts. Remaining candidates:
          the actually-installed _C_ascend .so (find was truncated by head -5),
          ATB (ascend-transformer-boost) libs, or CANN opp binary content.
          Fastest decisive check: runtime enum of torch_npu op names in
          Python, plus full-name grep on the raw profiling text.
    aclnn: null
    microbench_api: "torch.ops._C_ascend.npu_dequant_swiglu_quant (verify SiTU-mode args for K3 MoE path)"

