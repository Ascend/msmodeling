# ============================================================================
#torch_npu reference (for microbenchmark script generation)
# ============================================================================

torch_npu_reference:

  MatMulV2:
    apis:
      - name: "torch.mm"
        note: "aten::mm → op_api::mm → aclnnMm / aclnnMatmulWeightNz"
    aclnn: [aclnnMm, aclnnMatmulWeightNz]
    microbench_api: "torch.mm"

  QuantBatchMatmulV3:
    apis:
      - name: "torch_npu.npu_quant_matmul"
        note: "aclnnQuantMatmulWeightNz (CANN 9.1+, used by QuantBatchMatmulV3_run.py)"
      - name: "torch_npu.npu_weight_quant_batchmatmul"
        note: "aclnnWeightQuantBatchMatmulV2/V3 (W8A8/W4A8/FP8, legacy CANN 8.x)"
    aclnn: [aclnnWeightQuantBatchMatmulV2, aclnnWeightQuantBatchMatmulV3, aclnnQuantMatmulWeightNz]
    microbench_api: "torch_npu.npu_quant_matmul"

  FusedInferAttentionScore:
    apis:
      - name: "torch_npu.npu_fused_infer_attention_score"
        note: "aclnnFusedInferAttentionScoreV2/V3"
    aclnn: [aclnnFusedInferAttentionScoreV2, aclnnFusedInferAttentionScoreV3]
    microbench_api: "torch_npu.npu_fused_infer_attention_score"

  GroupedMatmul:
    apis:
      - name: "torch_npu.npu_grouped_matmul"
        note: "aclnnGroupedMatmul/V4/V5/WeightNz"
    aclnn: [aclnnGroupedMatmul, aclnnGroupedMatmulV4, aclnnGroupedMatmulV5]
    microbench_api: "torch_npu.npu_grouped_matmul"

  RmsNorm:
    apis:
      - name: "torch_npu.npu_rms_norm"
        note: "aclnnRmsNorm"
    aclnn: aclnnRmsNorm
    microbench_api: "torch_npu.npu_rms_norm"

  AddRmsNormBias:
    apis:
      - name: "torch.ops._C_ascend.npu_add_rms_norm_bias"
        note: "vllm-ascend custom op (csrc/add_rms_norm_bias/) → aclnnAddRmsNormBias"
    aclnn: aclnnAddRmsNormBias
    microbench_api: "torch.ops._C_ascend.npu_add_rms_norm_bias"

  AddRmsNorm:
    apis:
      - name: "torch_npu.npu_add_rms_norm"
        note: "aclnnAddRmsNorm (CANN 8.3 path)"
    aclnn: aclnnAddRmsNorm
    microbench_api: "torch_npu.npu_add_rms_norm"

  SwiGlu:
    apis:
      - name: "torch_npu.npu_swiglu"
        note: "aclnnSwiGlu"
    aclnn: aclnnSwiGlu
    microbench_api: "torch_npu.npu_swiglu"

  AscendQuantV2:
    apis:
      - name: "torch_npu.npu_quantize"
        note: "aclnnAscendQuant / aclnnAscendQuantV3"
    aclnn: [aclnnAscendQuant, aclnnAscendQuantV3]
    microbench_api: "torch_npu.npu_quantize"

  DynamicQuant:
    apis:
      - name: "torch_npu.npu_dynamic_quant"
        note: "aclnnDynamicQuant / aclnnDynamicQuantV2"
    aclnn: [aclnnDynamicQuant, aclnnDynamicQuantV2]
    microbench_api: "torch_npu.npu_dynamic_quant"

