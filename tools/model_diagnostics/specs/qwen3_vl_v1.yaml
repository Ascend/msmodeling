schema_version: "1"
spec_id: qwen3_vl_v1
spec_version: 1.1.2
model_category: qwen3_vl
matches:
  entrypoints: [text_generate]
  model_types: [qwen3_vl]

operator_aliases:
  aten.index_select.default: index
  addmm: mm
  aten.addmm.default: mm
  vision_patch_embedding: convolution
  vision_qkv_projection: mm
  vision_attention: attention
  vision_o_projection: mm
  vision_mlp_fc1: mm
  vision_mlp_fc2: mm
  vision_merger_fc1: mm
  vision_merger_fc2: mm

regions:
  input:
    stages:
      - id: text_embedding
        source_options:
          theory:
            modules:
              - name: embedding
                tensors:
                  INPUT[0]: {shape: "[EV, EH]", dtype: WEIGHT}
                  INPUT[1]: {shape: "[B, Q]", dtype: int64}
                  OUTPUT[0]: {shape: "[B, Q, EO]", dtype: ACT}
          runtime:
            boundary_operators: [embedding]
            ignored_operators:
              - view
              - index
              - alias
              - slice
              - unsqueeze
              - expand
              - bitwise_not
              - where
              - masked_fill_
              - all_gather
              - all_reduce
              # Vision position/grid preparation runs before the patch
              # convolution. Keep those framework mechanics outside the
              # embedding contract without a Runtime-only pseudo Stage.
              - linspace
              - detach
              - _to_copy
              - add
              - clamp
              - sub
              - rsub
              - mul
              - arange
              - transpose
              - clone
              - _unsafe_view
              - repeat
              - cat
              - stack
              - lift_fresh
              - select
              - repeat_interleave
              - index_select
              - cumsum
              - constant_pad_nd
              - sum
        comparisons:
          theory-runtime:
            strategy: boundary_equal
            options:
              mapping:
                mode: explicit
                pairs:
                  - left_call_index: 0
                    left_slot: {direction: output, index: 0, name: null}
                    right_call_index: 0
                    right_slot: {direction: output, index: 0, name: null}
                relations: []

  vision_prelude:
    activation: vision_prefill
    stages:
      - id: vision_patch_embedding
        source_options:
          theory:
            modules:
              - name: vision_patch_embedding
                tensors:
                  INPUT[0]: {shape: "[VTok, Vc, Vt, Vp, Vp]", dtype: ACT}
                  INPUT[1]: {shape: "[VH, Vc, Vt, Vp, Vp]", dtype: WEIGHT}
                  INPUT[2]: {shape: "[VH]", dtype: WEIGHT}
                  OUTPUT[0]: {shape: "[VTok, VH, 1, 1, 1]", dtype: ACT}
          runtime:
            boundary_operators: [convolution]
            ignored_operators:
              - _to_copy
              - view
              - embedding
              - unsqueeze
              - mul
              - sum
              - add
              - cat
              - cos
              - sin

  vision_encoder:
    activation: vision_prefill
    layer_layout_rule:
      strategy: sequence
      count_from: model_config.vision_num_hidden_layers
      kinds_from: model_config.vision_layer_kinds
    layer_specs:
      qwen3_vl_vision_block:
        include_fragment:
          fragment: qwen3_vl_vision_encoder_v1
          stage_group: block
      qwen3_vl_deepstack_vision_block:
        include_fragment:
          fragment: qwen3_vl_vision_encoder_v1
          stage_group: deepstack_block

  vision_merger:
    activation: vision_prefill
    include_fragment:
      fragment: qwen3_vl_vision_encoder_v1
      stage_group: final_merger

  language:
    layer_layout_rule:
      strategy: repeat
      layer_kind: qwen3_vl_text_decoder
      count_from: model_config.effective_num_hidden_layers
    layer_specs:
      qwen3_vl_text_decoder:
        include_fragment: qwen3_dense_decoder_v1
        runtime_options:
          attention_qkv:
            boundary_operators:
              - rms_norm
              - rms_norm_dynamic_quant_symmetric
              - rms_norm_quant
            ignored_operators:
              - rms_norm
              - rms_norm_dynamic_quant_symmetric
              - rms_norm_quant
              - view
              - index
              - reshape_and_cache
              - split_with_sizes
              - alias
              - copy_
              - slice
              - select
              - apply_rope
              - permute
              - dynamic_quantize_symmetric
              - mean
              - pow
              - rsqrt
              - add
              - mul
              - _to_copy
              - unsqueeze

  output:
    stages:
      - id: lm_head
        source_options:
          theory:
            modules:
              - name: lm_head_select
                activation: lm_head_token_selection
                tensors:
                  INPUT[0]: {shape: "[B, Q, H]", dtype: ACT}
                  INPUT[1]: {shape: "[B]", dtype: int64}
                  OUTPUT[0]: {shape: "[B, 1, H]", dtype: ACT}
              - name: lm_head
                activation: non_mtp_lm_head
                tensors:
                  INPUT[0]: {shape: "[Rout, H]", dtype: ACT}
                  OUTPUT[0]: {shape: "[Rout, Vtp]", dtype: OUT}
          runtime:
            boundary_operators: [rms_norm]
            ignored_operators:
              - rms_norm
              - view
              - slice
              - alias
              - copy_
              - dynamic_quantize_symmetric
              - device_put
              - select
              - argmax

  # The simulation command enables TensorCast MTP. The predictor reuses the
  # Hugging Face Qwen3-VL text decoder, so its operator contract is shared with
  # the ordinary language layer rather than inferred from checkpoint metadata.
  mtp:
    activation: mtp_enabled
    layer_layout_rule:
      strategy: repeat
      layer_kind: qwen3_vl_dense_mtp
      count_from: model_config.effective_num_mtp_layers
    compose:
      framework: mtp_framework_v1
      predictor: qwen3_dense_decoder_v1
