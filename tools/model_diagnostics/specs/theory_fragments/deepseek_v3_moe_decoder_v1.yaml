# DeepSeek-V3 family decoder: MLA attention, optional DSA, followed by Dense or MoE FFN.
fragment_id: deepseek_v3_moe_decoder_v1
fragment_kind: model_decoder

stages:
  - id: mla_projection
    modules:
      - name: mlapo
        activation: mlapo_enabled
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: ACT}
          OUTPUT[0]: {shape: "[T, Lh, Hmla]", dtype: ACT}
          OUTPUT[1]: {shape: "[T, KVlora]", dtype: ACT}
          OUTPUT[2]: {shape: "[T, QKrope]", dtype: ACT}
          OUTPUT[3]: {shape: "[T, Qlora]", dtype: ACT}
          OUTPUT[4]: {shape: "[Tprefill, Lh, QKnope + Vh]", dtype: ACT}
          OUTPUT[5]: {shape: "[Tdecode, Lh, KVlora + QKrope]", dtype: ACT}
      - name: qkv_a_projection
        activation: mlapo_disabled_compiled
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Qlora + KVlora + QKrope]", dtype: OUT}
      - name: q_a_projection
        activation: mlapo_disabled_eager
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Qlora]", dtype: OUT}
      - name: q_b_projection
        activation: mlapo_disabled
        tensors:
          INPUT[0]: {shape: "[T, Qlora]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Lh * Hmla]", dtype: OUT}
      - name: kv_a_projection
        activation: mlapo_disabled_eager
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, KVlora + QKrope]", dtype: OUT}
      - name: dsa_indexer
        activation: dsa_opaque
        tensors:
          INPUT[0]: {shape: "[B, Q, H]", dtype: ACT}
          INPUT[1]: {shape: "[B, Q, Qlora]", dtype: ACT}
          OUTPUT[0]: {shape: "[B, Q, Dsa_k]", dtype: int64}
      - name: mm
        activation: dsa_expanded_compiled
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: DSA_PREP_IN}
          OUTPUT[0]: {shape: "[T, Dsa_dim + Dsa_heads]", dtype: ACT}
      - name: mm
        activation: dsa_expanded_eager
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: ACT}
          OUTPUT[0]: {shape: "[T, Dsa_dim]", dtype: ACT}
      - name: mm
        activation: dsa_expanded_eager
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: ACT}
          OUTPUT[0]: {shape: "[T, Dsa_heads]", dtype: ACT}
      - name: mm
        activation: dsa_expanded
        tensors:
          INPUT[0]: {shape: "[T, Qlora]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Dsa_heads * Dsa_dim]", dtype: ACT}
      - name: dsa_indexer
        activation: dsa_expanded
        tensors:
          INPUT[0]: {shape: "[T, Dsa_heads, Dsa_dim]", dtype: ACT}
          INPUT[1]: {shape: "[T, Dsa_heads]", dtype: ACT}
          OUTPUT[0]: {shape: "[T, Dsa_topk]", dtype: int64}
      - name: mm
        activation: mla_prefill_kv_projection
        tensors:
          INPUT[0]: {shape: "[T, KVlora]", dtype: ACT}
          INPUT[1]: {shape: "[KVlora, Lh * (QKnope + Vh)]", dtype: WEIGHT}
          OUTPUT[0]: {shape: "[Tprefill, Lh * (QKnope + Vh)]", dtype: ACT}
    runtime:
      boundary_operators: [rms_norm]
      ignored_operator_groups: [rms_norm_kernels, shape_views]
      ignored_operators: [index, mla_q_absorb_projection, mla_q_absorb_projection_quant, siso_reshape_and_cache, layer_norm, convert_element_type, _to_copy, permute, index_put, index_copy, index_copy_, bmm, t, transpose, slice, split_with_sizes, cat, mul, add, neg, rope, apply_rope_single, dynamic_quantize_symmetric, concat_and_cache_mla, quantize]

  - id: sparse_attention
    modules:
      - name: mla_sparse_attention_core
        tensors:
          INPUT[0]: {shape: "[T, Lh, Hmla]", dtype: ACT}
          INPUT[1]: {shape: "[Tprefill, Lh, QKnope + Vh]", dtype: ACT}
          INPUT[2]: {shape: "[Tdecode, Lh, KVlora + QKrope]", dtype: ACT}
          INPUT[3]: {shape: "[Nblk, Bs, KVlora + QKrope]", dtype: ACT}
          INPUT[4]: {shape: "[B, Mb]", dtype: int64}
          INPUT[5]: {shape: "[B + 1]", dtype: int64}
          INPUT[6]: {shape: "[B]", dtype: int64}
          INPUT[7]: {shape: "[B]", dtype: int64}
      - name: mla_sparse_attention
        tensors:
          OUTPUT[0]: {shape: "[T, Lh, Vh]", dtype: ACT}
      - name: o_projection
        tensors:
          INPUT[0]: {shape: "[T, Lh * Vh]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, H]", dtype: OUT}
    runtime:
      boundary_operators: [multihead_latent_attention, multihead_latent_attention_quant, mla_sparse_attention, mla_sparse_attention_quant]
      ignored_operator_groups: [collective_communication, rms_norm_kernels, quantization, dtype_cast, shape_views, tensor_storage]
      ignored_operators: [concat_and_cache_mla, mla_kv_projection, mla_kv_projection_quant, mla_v_up_projection, mla_v_up_projection_quant, constant_pad_nd, slice, add, siso_reshape_and_cache, layer_norm]

  - id: moe_gate
    modules:
      - name: mm
        # Most DeepSeek-family runtimes expose a standalone gate mm; kimi_k2
        # patches MoE inference so routing is fused without a gate call, and
        # this stage is omitted for that model_type (explicit_moe_gate=False).
        activation: explicit_moe_gate
        tensors:
          # MOE_GATE_TOKENS is T when the raw-logits EP path gates on the full
          # token sequence before the expert exchange, else Tmoe (post-transform
          # domain). See context_env._moe_input_token_count / MOE_GATE_TOKENS.
          INPUT[0]: {shape: "[MOE_GATE_TOKENS, H]", dtype: float32}
          OUTPUT[0]: {shape: "[MOE_GATE_TOKENS, E]", dtype: float32}
      - name: moe_gating_top_k_softmax
        activation: moe_fused_topk
        tensors:
          # Fused top-k + softmax over the router logits. Runs on the
          # post-transform Tmoe domain in every layout (the raw-logits EP path
          # slices the logits by TP before this kernel; confirmed by probe).
          INPUT[0]: {shape: "[Tmoe, E]", dtype: float32}
          OUTPUT[0]: {shape: "[Tmoe, Ktop]", dtype: float32}
          OUTPUT[1]: {shape: "[Tmoe, Ktop]", dtype: int64}
    runtime:
      boundary_operators: [add_rms_norm2]
      # The fused moe_gating_top_k_softmax is the validated top-k contract; the
      # unfused expansion ops (topk/sum/scatter/bitwise_not/where/gather/...) only
      # appear on alternate compile/quant paths and remain mechanical.
      ignored_operator_groups: [quantization, dtype_cast, collective_communication, rms_norm_kernels, shape_views, tensor_storage, broadcast_shapes]
      ignored_operators: [sigmoid, add, topk, sum, scatter, bitwise_not, where, gather, div, mul, constant_pad_nd, slice, siso_reshape_and_cache, layer_norm]

  - id: moe_dispatch
    modules:
      - name: init_routing_v2
        tensors:
          OUTPUT[0]: {shape: "[Tmoe * Ktop, H]", dtype: ACT}
    runtime:
      boundary_operators: [init_routing_v2]
      ignored_operator_groups: [collective_communication, quantization, dtype_cast, shape_views, tensor_split]
      ignored_operators: [cat, siso_reshape_and_cache, layer_norm, permute, t, transpose, slice, bmm, index_put, index_copy, index_copy_]

  - id: moe_experts
    modules:
      - name: grouped_matmul_swiglu
        tensors:
          OUTPUT[0]: {shape: "[Te, Fe]", dtype: OUT}
      - name: grouped_matmul
        tensors:
          OUTPUT[0]: {shape: "[Te, H]", dtype: OUT}
    runtime:
      boundary_operators: [grouped_matmul_swiglu, grouped_matmul_quant_swiglu, grouped_matmul_quant_int4_swiglu, grouped_matmul_fp8_swiglu, grouped_matmul_mxfp4_swiglu]
      ignored_operator_groups: [collective_communication, quantization, dtype_cast, tensor_split]
      ignored_operators: [slice, cat, siso_reshape_and_cache, layer_norm]

  - id: moe_combine
    modules:
      - name: unpermute_tokens
        tensors:
          OUTPUT[0]: {shape: "[Tmoe, Ktop, H]", dtype: ACT}
      - name: mul
        tensors:
          OUTPUT[0]: {shape: "[Tmoe, Ktop, H]", dtype: MOE_COMBINE_DTYPE}
      - name: sum
        tensors:
          OUTPUT[0]: {shape: "[Tmoe, H]", dtype: MOE_COMBINE_DTYPE}
    runtime:
      boundary_operators: [unpermute_tokens]
      ignored_operator_groups: [collective_communication, quantization, dtype_cast, shape_views, tensor_split]
      ignored_operators: [slice, cat, siso_reshape_and_cache, layer_norm]

  - id: shared_ffn
    modules:
      - name: mm
        tensors:
          INPUT[0]: {shape: "[Tmoe, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[Tmoe, 2 * Fshared]", dtype: OUT}
      - name: swiglu
        tensors:
          OUTPUT[0]: {shape: "[Tmoe, Fshared]", dtype: ACT}
      - name: mm
        tensors:
          INPUT[0]: {shape: "[Tmoe, Fshared]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[Tmoe, H]", dtype: OUT}
    runtime:
      # The in-model shared expert has no dedicated Runtime wrapper. Its first
      # observable operation is the gate/up linear, so a linear boundary is the
      # narrowest boundary that preserves the complete shared FFN contract.
      boundary_operators: [mm, static_quant_linear, static_quant_linear_int4, fp8_linear, mxfp4_linear]
      ignored_operator_groups: [quantization, dtype_cast, slice_select, collective_communication, rms_norm_kernels, shape_views, tensor_storage, tensor_split]
      ignored_operators: [add, siso_reshape_and_cache, layer_norm, permute, t, transpose, bmm, cat, index_put, index_copy, index_copy_]
