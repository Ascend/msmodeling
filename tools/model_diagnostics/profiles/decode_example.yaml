# ============================================================
# Sample reference profile: Qwen3 MoE decode
# ============================================================
# Sample/reference profile listing every configurable field
# (including defaults), using Qwen/Qwen3-30B-A3B as the example.
# Keep only the fields you want to override for local use.
# Decode defaults to MTP on: num_mtp_tokens=2 requires Q >= MTP + 1.

schema_version: "1"   # optional, default "1"
model_name: Qwen/Qwen3-30B-A3B   # required; model id passed to the ModelRunner
entrypoint: text_generate   # optional, default text_generate
phase: decode   # required; prefill | decode
batch_size: 1   # required; positive integer
query_length: 3   # required; positive integer
context_length: 128   # optional, default null (0 in Theory)
num_mtp_tokens: 2   # optional, default 0

parallel:   # optional, dimensions default to 1
  tensor_parallel_size: 1   # optional, default 1; TP (--tensor-parallel-size)
  pipeline_parallel_size: 1   # optional, default 1; PP (--pipeline-parallel-size)
  data_parallel_size: 1   # optional, default 1; DP (--data-parallel-size)
  expert_parallel_size: 1   # optional, default 1; EP (--expert-parallel-size)
  moe_data_parallel_size: 1   # optional, default 1; MoE DP (--moe-dp-size / MDP)

selected_language_layers: null   # optional, default all executed layers
selected_stage_regions: []   # optional, default all non-layered regions
num_hidden_layers_override: 1   # optional, default 0; 0 = all model layers
do_compile: true   # optional, default true
device: TEST_DEVICE   # optional, default TEST_DEVICE
quantize_linear_action: DISABLED   # optional, default DISABLED
word_embedding_tp: null   # optional, default null
enable_redundant_experts: false   # optional, default false; requires EP > 1
enable_external_shared_experts: false   # optional, default false; requires EP > 1
